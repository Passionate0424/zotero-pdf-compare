name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Build release package
        run: python tools/build-dev-xpi.py --release
      - run: python tools/check-release-package.py
      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python -c "import json,os; v=json.load(open('addon/manifest.json',encoding='utf-8'))['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v, 'Tag and manifest version differ'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.xpi
            dist/*.sha256
            dist/updates.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/build-dev-xpi.py --release
      - run: python tools/check-release-package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/*.sha256 dist/updates.json --verify-tag --title "Zotero PDF Compare $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
